name: Bug report
description: Report incorrect behavior in the facilitator service
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use private reporting as
        described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or requests, including the request and response.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The tag or commit SHA you are running.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "verify"
        - "settle"
        - "ops"
        - "docs"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability. Security issues go to SECURITY.md.
          required: true
